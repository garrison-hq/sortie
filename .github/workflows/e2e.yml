name: E2E (manual)

# The full-stack Playwright suite boots the real server and makes one
# live LLM extraction call, so it needs a provider key and is run on
# demand rather than on every push. Set the OPENAI_API_KEY repository
# secret (and optionally E2E_OPENAI_MODEL) before dispatching.

on:
  workflow_dispatch:

jobs:
  e2e:
    name: full-stack e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SORTIE_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.E2E_OPENAI_MODEL || 'gpt-4.1-mini' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm browsers --with-deps
      - run: pnpm --filter @garrison-hq/sortie-ui e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/ui/playwright-report/
            apps/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
